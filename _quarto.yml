project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - about.qmd
    - publications.qmd
    - projects.qmd
    - talks.qmd
    - tutoring.qmd
  resources:
    - foto.png
    - docs/elisa-fazzari-academic-cv.pdf

website:
  title: "Elisa Fazzari"
  description: "Elisa Fazzari’s academic website. Cosmology research, publications and university teaching."
  open-graph: true
  search: true
  navbar:
    left:
      - text: About
        href: about.qmd
      - text: Research
        menu:
          - text: Publications
            href: publications.qmd
          - text: Projects
            href: projects.qmd
          - text: Talks and Posters
            href: talks.qmd
      - text: Teaching
        menu:
          - text: Teaching and mentoring
            href: tutoring.qmd
    right:
      - text: ORCID
        href: https://orcid.org/0009-0005-0594-4128
      - icon: envelope
        text: Email
        href: "mailto:elisa.fazzari@uniroma1.it"
  page-footer:
    left: "© 2026 Elisa Fazzari"
    right: 'Built with <a href="https://quarto.org">Quarto</a>'

format:
  html:
    lang: en
    theme:
      dark: [darkly, dark.scss]
      light: [flatly, light.scss]
    toc: true
    toc-depth: 3
    toc-title: On this page
    smooth-scroll: true
    css: styles.css
    code-copy: true
